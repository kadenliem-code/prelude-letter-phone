<title>Clue</title>
<style>

.meta{display:flex;justify-content:space-between;font-weight:800}
.note{margin:4px 0 8px;font-weight:650}

.hands{display:grid;grid-template-columns:1fr 1fr;background:var(--card);color:var(--ink);border-radius:18px;padding:6px 2px 8px}
.col+.col{border-left:1px solid #d9d0c2}
.role{margin:0;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;color:#8d8680}
.letter{margin:0;text-align:center;font-family:Georgia,serif;font-weight:700;line-height:1.02}

.hold{color:var(--gray);font-size:.62em}
.big .letter{font-size:34px} .mid .letter{font-size:18px} .sm .letter{font-size:14px}
.now{outline:3px solid var(--gold)}
.line{height:3px;background:var(--gold);margin:8px 4px}
.lyric{margin:8px 0 0;text-align:center;font-size:22px;font-weight:800}
.tail{margin:0;text-align:center;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.controls button,.three button{min-height:52px;border-radius:16px;font-weight:800}
.controls button{background:var(--card);color:var(--ink);font-size:18px}
.go{background:var(--gold)!important;color:var(--ink)!important}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.three button{background:#241433;color:var(--fg)}
</style></head><body>

let song=0, index=7, playing=false, timer=0;
const $=id=>document.getElementById(id);
function pitch(k){return k.o*12+(PC[k.n]??0)}
function ordered(keys, highFirst){return [...keys].sort((a,b)=> highFirst? pitch(b)-pitch(a) : pitch(a)-pitch(b))}
function stack(keys, size, highFirst){
  const rows=ordered(keys, highFirst);
  if(!rows.length) return '<p class="letter">—</p>';
  return '<div class="'+size+'">'+rows.map(k=>'<p class="letter'+(k.h?' hold':'')+'">'+(k.h?'hold ':'')+k.n+'<i>'+k.o+'</i></p>').join('')+'</div>';
}
function hands(ev, size, highFirst){
  return '<div class="hands"><div class="col"><p class="role">RIGHT</p>'+stack(ev.r,size,highFirst)+'</div><div class="col"><p class="role">LEFT</p>'+stack(ev.l,size,highFirst)+'</div></div>';
}
function render(){

document.body.addEventListener('click',ev=>{

  if(t.dataset.act==='next') index=Math.min(s.events.length-1,index+1);
  if(t.dataset.act==='play') playing=!playing;

});
