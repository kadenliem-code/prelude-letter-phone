<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>huge</title><style>
:root{color-scheme:dark;--desk:#14110e;--card:#f3efe6;--ink:#2c2823;--pencil:#8d8680;--accent:#e4c56a;--ink2:#1c1404;--fg:#f6f1fb;--muted:#c4b3d4;--surface:#241433;--rule:#d9d0c2}
*{box-sizing:border-box} body{margin:0;background:var(--desk);color:var(--fg);font-family:Outfit,ui-sans-serif,system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0} a{color:var(--accent)}
header{position:sticky;top:0;z-index:3;background:#14110ee6;padding:8px 10px 6px;backdrop-filter:blur(8px)}
.who{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.row{display:flex;gap:6px;overflow-x:auto;padding-top:8px}
.chip{min-height:40px;flex:0 0 auto;border-radius:999px;padding:0 12px;background:var(--surface);color:var(--fg);font-size:13px;font-weight:700}
.chip.on{background:var(--accent);color:var(--ink2)}
main{max-width:460px;margin:0 auto;padding:8px 10px 32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{min-height:76px;border-radius:18px;background:var(--card);color:var(--ink);font-size:18px;font-weight:800}
.meta{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.note{min-height:20px;margin:4px 0 8px;font-weight:650}
.page{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--card);color:var(--ink);border-radius:12px;padding:6px 2px 8px;min-height:120px}
.cell.stop{outline:3px solid var(--accent)}
.cell .n{text-align:center;font-size:11px;font-weight:800;color:var(--pencil);margin:0}
.letter{text-align:center;line-height:1;margin:1px 0;font-family:Georgia,serif}
.hold{color:var(--pencil);font-family:Outfit,sans-serif;font-size:11px;font-weight:700}
.dash{text-align:center;color:var(--pencil);font-size:28px;margin:8px 0}
.oct{font-family:Outfit,sans-serif;font-size:.4em;margin-left:1px}
.big .letter{font-size:42px} .mid .letter{font-size:22px} .sm .letter{font-size:13px}
.hands{display:grid;grid-template-columns:1fr 1fr;background:var(--card);color:var(--ink);border-radius:22px;padding:8px 4px 12px}
.hands.dark{background:#1b140c;color:#f3efe6}
.hands.gold{background:#f6e7b2;color:#1c1404}
.col+.col{border-left:1px solid #d9d0c2}
.role{text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--pencil)}
.stage{position:relative;height:420px;background:#100c09;border-radius:22px;overflow:hidden}
.nowline{position:absolute;left:8px;right:8px;bottom:72px;height:2px;background:var(--accent)}
.block{position:absolute;min-width:46px;padding:6px 4px;border-radius:8px;background:#f3efe6;color:#1c1404;text-align:center;font-weight:800}
.block.held{background:transparent;color:#8d8680;border:1px dashed #8d8680;font-size:12px}
.tail{position:absolute;width:8px;background:#8d868088;border-radius:4px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.controls button,.three button{min-height:54px;border-radius:16px;font-weight:800}
.controls button{background:var(--card);color:var(--ink);font-size:18px}
.go{background:var(--accent)!important;color:var(--ink2)!important}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.three button{background:var(--surface);color:var(--fg);font-size:13px}
.card{display:block;width:100%;text-align:left;background:#2a2118;color:var(--fg);border-radius:14px;padding:8px 10px;margin:0 0 6px}
.card.on{outline:2px solid var(--accent)}
table{width:100%;border-collapse:collapse} td{border-bottom:1px solid var(--rule);padding:5px 0;font-weight:700}
td:first-child{color:var(--pencil);font-size:12px;width:36%}
</style></head><body>

const START="huge";
const PC={C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
const VIEWS=[["home","Home"],["bench","Bench"],["book","Book"],["play","Play"],["paper","Paper"],["sheets","Sheets"],["best","Best"],["synth","Synth"],["huge","Huge"],["step","Step"],["voice","Voice"],["film","Film"],["content","Content"],["genome","Genome"]];
const BLURB={
 home:"Pick a screen. Each name is a different picture.",
 bench:"One strike. Cream card. Left stack is your right hand.",
 book:"Eight strikes on one page, like a book. Starts at the gold A#.",
 play:"Dark stage. Play walks the strikes.",
 paper:"Gold paper, one strike, written-size letters.",
 sheets:"Every strike, small, in order. Tap one.",
 best:"The dark cards. Strike 8 through 13, big enough to read.",
 synth:"Letter blocks on a line. Play moves them. A hold is a tail, not a new strike.",
 huge:"Two giant strikes.",
 step:"Only this strike. Next letters stay hidden while Slow is on.",
 voice:"Tap Say. It speaks new letters only.",
 film:"Play turns the page. Four strikes, then the next four.",
 content:"Every parameter of this strike.",
 genome:"All 98. Filter by tapping a chip, then a row."
};
let index = START==="book"||START==="best"||START==="film"?7:7;
let view = START==="index"||START==="home"?"home":START;
let showNext=false, playing=false, timer=0, filmPage=0;
const $=id=>document.getElementById(id);
function byPitch(keys){return [...keys].sort((a,b)=>a.o*12+(PC[a.n]||0)-(b.o*12+(PC[b.n]||0)))}
function place(i){if(i<20)return"Opening";if(i<52)return"Fast middle";if(i<85)return"After the middle";return"Ending"}
function fresh(keys){return byPitch(keys.filter(k=>!k.h))}
function held(keys){return byPitch(keys.filter(k=>k.h))}
function spell(keys){return keys.length?keys.map(k=>k.n+k.o).join(" "):"—"}
function banner(hit){if(!hit)return"";if(hit.ash)return"Stop. The next strikes are still the opening.";if(hit.n===53)return"Practice mark. Not a measure.";if(hit.wait)return"Wait. Let it sound.";return""}
function stack(keys, cls){
  const ordered=byPitch(keys);
  if(!ordered.length) return '<p class="dash">—</p>';
  const size=cls||"mid";
  return '<div class="'+size+'">'+ordered.map(k=>k.h?'<p class="letter hold">'+k.n+'<span class="oct">'+k.o+'</span></p>':'<p class="letter">'+k.n+'<span class="oct">'+k.o+'</span></p>').join("")+'</div>';
}
function cell(hit){
  return '<div class="cell mid'+(hit.ash?" stop":"")+'"><p class="n">'+hit.n+(hit.ash?" stop":hit.n===53?" mark":"")+'</p><div>'+stack(hit.r)+'</div><p class="n">L</p><div>'+stack(hit.l)+'</div></div>';
}
function hands(hit, theme){
  return '<div class="hands '+theme+'"><div class="col"><p class="role">RIGHT HAND</p>'+stack(hit.r,"big")+'</div><div class="col"><p class="role">LEFT HAND</p>'+stack(hit.l,"big")+'</div></div>';
}
function controls(){
  return '<div class="controls"><button type="button" data-act="back">Back</button><button class="go" type="button" data-act="next">Next</button></div><div class="three"><button type="button" data-act="play">'+(playing?"Pause":"Play")+'</button><button type="button" data-act="stop">Stop 8</button><button type="button" data-act="mark">Mark 53</button></div>';
}
function synth(hit){
  const lanes=["R","L"];
  let html='<div class="stage"><div class="nowline"></div>';
  [0,1,2,3].forEach(step=>{
    const h=HITS[index+step]; if(!h) return;
    const y = step===0? 300 : 220-step*62;
    ["r","l"].forEach((hand,hi)=>{
      const keys=byPitch(h[hand]);
      keys.forEach((k,i)=>{
        const x= 24 + hi*210 + (i%4)*52;
        if(k.h && step===0){ html+='<div class="tail" style="left:'+(x+18)+'px;top:'+(y+36)+'px;height:70px"></div>'; }
        html+='<div class="block'+(k.h?" held":"")+'" style="left:'+x+'px;top:'+y+'px">'+(k.h?"hold ":"")+k.n+'<span class="oct">'+k.o+'</span></div>';
      });
    });
  });
  return html+'</div>';
}
function render(){
  clearInterval(timer); timer=0;
  const hit=HITS[index];
  $("who").textContent = (VIEWS.find(v=>v[0]===view)||["","Home"])[1];
  $("sub").textContent = BLURB[view]||"";
  $("bar").innerHTML = VIEWS.map(v=>'<button type="button" class="chip'+(v[0]===view?" on":"")+'" data-view="'+v[0]+'">'+v[1]+'</button>').join("");
  let body="";
  if(view==="home"){
    body='<div class="grid">'+VIEWS.filter(v=>v[0]!=="home").map(v=>'<button class="pick" type="button" data-view="'+v[0]+'">'+v[1]+'</button>').join("")+'</div>';
  } else if(view==="book"||view==="film"){
    const start = view==="film"? 7+filmPage*4 : (index<7?0:7+Math.floor((index-7)/8)*8);
    const count = view==="film"?4:(index<7?7:8);
    const slice=HITS.slice(start, start+count);
    body='<p class="meta"><span>'+(view==="film"?"Page "+(filmPage+1)+" · play turns it":"Page of 8")+'</span><span>'+place(start)+'</span></p><p class="note">'+banner(HITS[start]||hit)+'</p><div class="page">'+slice.map(cell).join("")+'</div>'+controls();
  } else if(view==="sheets"||view==="genome"){
    body=HITS.map(h=>'<button type="button" class="card'+(h.n-1===index?" on":"")+'" data-go="'+(h.n-1)+'"><b>'+h.n+' · '+place(h.n-1)+(h.ash?" · stop":h.n===53?" · mark":"")+'</b><div>R '+spell(fresh(h.r))+'</div><div>L '+spell(fresh(h.l))+'</div></button>').join("")+controls();
  } else if(view==="best"){
    body='<p class="note">Dark cards 8–13. Same notes as the gold block.</p>'+HITS.slice(7,13).map(h=>'<div class="hands dark" style="margin-bottom:8px"><div class="col"><p class="role">'+h.n+' RIGHT</p>'+stack(h.r,"mid")+'</div><div class="col"><p class="role">LEFT</p>'+stack(h.l,"mid")+'</div></div>').join("");
  } else if(view==="synth"){
    body='<p class="meta"><span>Strike '+hit.n+'</span><span>'+place(index)+'</span></p><p class="note">'+banner(hit)+' Holds are tails. They do not sound again.</p>'+synth(hit)+controls();
  } else if(view==="huge"){
    const b=HITS[Math.min(97,index+1)];
    body='<p class="meta"><span>'+hit.n+' and '+b.n+'</span><span>'+place(index)+'</span></p>'+hands(hit,"")+hands(b,"")+controls();
  } else if(view==="content"){
    body='<p class="meta"><span>Strike '+hit.n+' of 98</span><span>'+place(index)+'</span></p><p class="note">'+banner(hit)+'</p><div class="hands" style="display:block;padding:8px 12px"><table>'+[["Place",place(index)],["Wait",hit.wait?"yes":"no"],["Pulse",hit.ms+" ms"],["Right new",spell(fresh(hit.r))],["Right held",spell(held(hit.r))],["Left new",spell(fresh(hit.l))],["Left held",spell(held(hit.l))]].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join("")+'</table></div>'+controls()+'<div class="three"><button type="button" data-act="say">Say new</button></div>';
  } else if(view==="step"){
    body='<p class="meta"><span>Strike '+hit.n+'</span><span>'+place(index)+'</span></p><p class="note">'+banner(hit)+(showNext?"":" Next hidden.")+'</p>'+hands(hit,"")+'<p class="sub">'+(showNext&&HITS[index+1]?"Next exists. Letters stay off this card.":"Slow is on. Next letters stay off.")+'</p>'+controls()+'<div class="three"><button type="button" data-act="slow">'+(showNext?"Hide next":"Show next exists")+'</button></div>';
  } else {
    const theme = view==="play"?"dark":view==="paper"?"gold":"";
    body='<p class="meta"><span>Strike '+hit.n+' of 98</span><span>'+place(index)+'</span></p><p class="note">'+banner(hit)+'</p>'+hands(hit,theme)+controls()+(view==="voice"?'<div class="three"><button type="button" data-act="say">Say new</button></div>':"");
  }
  $("app").innerHTML=body;
  if(playing && (view==="play"||view==="synth"||view==="film"||view==="bench")){
    const wait=Math.max(hit.ms||600, view==="film"?900:700);
    timer=setInterval(()=>{
      if(view==="film"){ if(7+filmPage*4+4<HITS.length) filmPage++; else playing=false; }
      else index=Math.min(97,index+1);
      render();
    }, wait);
  }
}
document.body.addEventListener("click",ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  if(t.dataset.view){ view=t.dataset.view; if(view==="book"||view==="film"||view==="best") index=7; render(); return; }
  if(t.dataset.go!=null){ index=Number(t.dataset.go); view="step"; render(); return; }
  const hit=HITS[index];
  if(t.dataset.act==="back"){ if(view==="film") filmPage=Math.max(0,filmPage-1); else if(view==="book") index=Math.max(0,index-8); else index=Math.max(0,index-1); }
  if(t.dataset.act==="next"){ if(view==="film") filmPage=Math.min(22,filmPage+1); else if(view==="book") index=Math.min(90,index+8); else index=Math.min(97,index+1); }
  if(t.dataset.act==="play") playing=!playing;
  if(t.dataset.act==="stop"){ index=7; filmPage=0; }
  if(t.dataset.act==="mark"){ index=52; filmPage=11; }
  if(t.dataset.act==="slow") showNext=!showNext;
  if(t.dataset.act==="say" && window.speechSynthesis){
    const parts=["Strike "+hit.n+"."]; if(hit.ash) parts.push("Stop."); if(hit.n===53) parts.push("After the middle.");
    ["Right","Left"].forEach((label,i)=>{ const keys=(i?hit.l:hit.r); const f=fresh(keys); parts.push(label); f.forEach(k=>parts.push(k.n.replace("#"," sharp")+" "+k.o)); if(keys.some(k=>k.h)) parts.push("Hold."); });
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(parts.join(" ")); u.rate=.82; speechSynthesis.speak(u);
  }
  render();
});
render();
</script></body></html>
