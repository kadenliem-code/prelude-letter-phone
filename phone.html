<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>After the cascade</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110e; color: #f4efe6; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 12px 0; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 1.7rem; line-height: 1; margin: 8px 0 2px; font-weight: 680; }
  .sub { margin: 0 0 8px; color: #c4b8a8; font-size: 0.92rem; }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .card { flex: 1; min-height: 0; background: #f4efe6; color: #1c1408; border-radius: 18px; overflow: auto; border: 3px solid #c4a15a; }
  .now { background: #c4a15a; color: #1c1404; text-align: center; font-weight: 800; padding: 4px; }
  .hands { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100% - 28px); }
  .hands > div { padding: 4px 2px 8px; }
  .hands > div + div { border-left: 1px solid #d9d0c2; }
  .lab { text-align: center; font-size: 11px; letter-spacing: .12em; color: #6d645c; margin: 2px 0 4px; }
  .at { margin: 0; text-align: center; font-family: Fraunces, Georgia, serif; font-weight: 680; font-size: clamp(1.55rem, 5.6dvh, 3.1rem); line-height: .92; }
  .hold { margin: 0; text-align: center; color: #6a625a; font-size: clamp(.85rem, 2.4dvh, 1.15rem); font-weight: 700; }
  .hold span { display: block; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; }
  .bar { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  button { min-height: 48px; border: 0; border-radius: 999px; background: #241c16; color: #f4efe6; font: 700 1rem Outfit, sans-serif; }
  button.play { background: #c4a15a; color: #1c1404; }
</style>
