<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letter names — 98 strikes</title>
<style>
  :root { color-scheme: dark; --desk:#14110e; --card:#f3efe6; --ink:#2c2823; --pencil:#8d8680; --accent:#e4c56a; --accent-ink:#1c1404; --fg:#f6f1fb; --muted:#c4b3d4; --surface:#241433; --rule:#d9d0c2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--desk); color:var(--fg); font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; border:0; }
  header { position: sticky; top:0; z-index:2; background:var(--desk); padding:10px 12px 6px; }
  header p { margin:0; font-size:13px; font-weight:700; }
  .row { display:flex; gap:6px; overflow-x:auto; padding-top:8px; }
  .chip { min-height:44px; flex:0 0 auto; border-radius:999px; padding:0 14px; background:var(--surface); color:var(--fg); font-size:13px; font-weight:700; }
  .chip.on { background:var(--card); color:var(--ink); }
  main { max-width:440px; margin:0 auto; padding:8px 12px 28px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pick { min-height:72px; border-radius:18px; background:var(--card); color:var(--ink); font-size:18px; font-weight:800; }
  .meta { display:flex; justify-content:space-between; gap:8px; font-size:14px; font-weight:700; }
  .note { min-height:22px; margin:4px 0 8px; font-size:14px; font-weight:650; }
  .hands { display:grid; grid-template-columns:1fr 1fr; gap:8px; background:var(--card); color:var(--ink); border-radius:24px; padding:12px 8px 16px; }
  .hands.dark { background:#1c1408; color:var(--card); }
  .hands.dark .quiet { color:#c4b3a4; }
  .col + .col { border-left:1px solid var(--rule); }
  .role { text-align:center; font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--pencil); margin:0 0 8px; }
  .letter { text-align:center; line-height:1.05; margin:2px 0; font-family: "Iowan Old Style", Palatino, Georgia, serif; }
  .hold { color:var(--pencil); font-family: Outfit, sans-serif; font-size:16px; font-weight:700; }
  .dash { font-size:56px; text-align:center; color:var(--pencil); margin:12px 0; }
  .oct { font-family: Outfit, sans-serif; font-size:.42em; margin-left:2px; color:var(--pencil); }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .controls button, .three button { min-height:58px; border-radius:16px; background:var(--card); color:var(--ink); font-size:18px; font-weight:800; }
  .go { background:var(--accent) !important; color:var(--accent-ink) !important; }
  .three { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
  .three button { min-height:48px; background:var(--surface); color:var(--fg); font-size:13px; }
  .tiny { font-size:13px; color:var(--muted); margin:6px 0; }
  .card { background:var(--card); color:var(--ink); border-radius:16px; padding:10px 12px; margin:0 0 8px; text-align:left; width:100%; }
  .card b { display:block; }
  .card.on { outline:2px solid var(--accent); }
  .line { font-size:15px; font-weight:700; }
  .sub { font-size:12px; color:var(--pencil); font-weight:700; }
  table { width:100%; border-collapse:collapse; }
  td { border-bottom:1px solid var(--rule); padding:6px 0; font-size:14px; font-weight:700; }
  td:first-child { color:var(--pencil); font-size:12px; width:34%; }
</style>
</head>

const PC = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
const VIEWS = [["home","Home"],["bench","Bench"],["book","Book"],["play","Play"],["paper","Paper"],["sheets","Sheets"],["best","Best"],["synth","Synth"],["huge","Huge"],["step","Step"],["voice","Voice"],["film","Film"],["content","Content"],["genome","Genome"]];
let index = 7;
let view = (location.hash||"#home").slice(1);
if (!VIEWS.some(v => v[0]===view)) view = "home";
let showNext = false;
const bar = document.getElementById("bar");
const app = document.getElementById("app");
function byPitch(keys){ return [...keys].sort((a,b)=> a.o*12+(PC[a.n]||0) - (b.o*12+(PC[b.n]||0))); }
function place(i){ if(i<20) return "Opening"; if(i<52) return "Fast middle"; if(i<85) return "After the middle"; return "Ending"; }
function fresh(keys){ return byPitch(keys.filter(k=>!k.h)); }
function held(keys){ return byPitch(keys.filter(k=>k.h)); }
function spell(keys){ return keys.length ? keys.map(k=>k.n+k.o).join(" ") : "—"; }
function size(n){ return n>=8?"28px":n>=6?"34px":n>=4?"42px":"52px"; }
function col(title, keys){
  const ordered = byPitch(keys);
  const body = ordered.length ? ordered.map(k => k.h
    ? '<p class="letter hold">hold '+k.n+'<span class="oct">'+k.o+'</span></p>'
    : '<p class="letter" style="font-size:'+size(ordered.length)+'">'+k.n+'<span class="oct">'+k.o+'</span></p>'
  ).join("") : '<p class="dash">—</p>';
  return '<div class="col"><p class="role">'+title+'</p>'+body+'</div>';
}
function banner(hit){
  if (hit.ash) return "Stop. The next strikes are still the opening.";
  if (hit.n===53) return "Practice mark. Not a measure.";
  if (hit.wait) return "Wait. Let it sound.";
  if (view==="voice") return "Voice waits until you tap Say. New letters only.";
  return "";
}
function hands(hit, theme){
  return '<div class="hands '+(theme||"")+'">'+col("Right hand", hit.r)+col("Left hand", hit.l)+'</div>';
}
function controls(){
  return '<div class="controls"><button type="button" data-act="back">Back</button><button type="button" class="go" data-act="next">Next</button></div>'
    + '<div class="three"><button type="button" data-act="slow">'+(showNext?"Slow off":"Slow on")+'</button><button type="button" data-act="stop">Stop 8</button><button type="button" data-act="mark">Mark 53</button></div>';
}
function head(hit){
  return '<div class="meta"><span>Strike '+hit.n+' of '+HITS.length+'</span><span>'+place(index)+'</span></div><p class="note">'+banner(hit)+'</p>';
}
function say(hit){
  if (!window.speechSynthesis) return;
  const parts = ["Strike "+hit.n+"."];
  if (hit.ash) parts.push("Stop.");
  if (hit.n===53) parts.push("After the middle.");
  else if (hit.n===9) parts.push("Still the opening.");
  const one = (label, keys) => {
    const f = fresh(keys);
    if (!f.length && !keys.some(k=>k.h)) { parts.push(label+" rests."); return; }
    parts.push(label+".");
    f.forEach(k => parts.push(k.n.replace("#"," sharp")+" "+k.o));
    if (keys.some(k=>k.h)) parts.push("Hold.");

  one("Right", hit.r); one("Left", hit.l);

  const u = new SpeechSynthesisUtterance(parts.join(" "));
  u.rate = 0.82;
  speechSynthesis.speak(u);
}
function card(hit, on){
  return '<button type="button" class="card'+(on?" on":"")+'" data-go="'+(hit.n-1)+'"><b>'+hit.n+' · '+place(hit.n-1)+(hit.ash?" · stop":hit.n===53?" · mark":hit.wait?" · wait":"")+'</b><span class="line">R '+spell(fresh(hit.r))+'</span>'+(held(hit.r).length?'<span class="sub">hold '+spell(held(hit.r))+'</span>':"")+'<span class="line">L '+spell(fresh(hit.l))+'</span>'+(held(hit.l).length?'<span class="sub">hold '+spell(held(hit.l))+'</span>':"")+'</button>';
}
function render(){
  const hit = HITS[index];
  document.getElementById("where").textContent = view==="home" ? "Tap a view" : (VIEWS.find(v=>v[0]===view)||["",""])[1] + " · strike " + hit.n;
  bar.innerHTML = VIEWS.map(v => '<button type="button" class="chip'+(v[0]===view?" on":"")+'" data-view="'+v[0]+'">'+v[1]+'</button>').join("");
  let body = "";
  if (view==="home") {
    body = '<div class="grid">'+VIEWS.filter(v=>v[0]!=="home").map(v=>'<button type="button" class="pick" data-view="'+v[0]+'">'+v[1]+'</button>').join("")+'</div><p class="tiny">Left column is the right hand. Lowest key on top. Hold is still down. A dash is an empty hand. Strike 8 is the stop. Strike 53 is a practice mark.</p>';
  } else if (view==="book") {
    const a = HITS[index], b = HITS[Math.min(HITS.length-1, index+1)];
    body = head(a)+hands(a)+(b.n!==a.n? '<p class="tiny">Next strike on this page</p>'+hands(b):"")+controls();
  } else if (view==="sheets" || view==="genome") {
    body = '<p class="tiny">'+(view==="genome"?"Every strike. Letter, octave, held or new.":"Sheets. Tap a strike.")+'</p>'+HITS.map(h=>card(h, h.n-1===index)).join("")+controls();
  } else if (view==="huge") {
    body = head(hit)+hands(hit)+controls();
  } else if (view==="synth") {
    const coming = [1,2,3].map(step => HITS[index+step]).filter(Boolean);
    body = head(hit)+hands(hit)+coming.map(h=>'<p class="tiny">Coming '+h.n+' · R '+spell(fresh(h.r))+' / L '+spell(fresh(h.l))+'</p>').join("")+controls();
  } else if (view==="film") {
    const prev = index>0 ? HITS[index-1] : null;
    const next = index<HITS.length-1 ? HITS[index+1] : null;
    body = head(hit)+'<p class="tiny">Just played '+(prev?spell(fresh(prev.r))+" / "+spell(fresh(prev.l)):"—")+'</p>'+hands(hit)+'<p class="tiny">'+(showNext&&next? "Next new "+spell(fresh(next.r))+" / "+spell(fresh(next.l))+(hit.ash?" · still the opening":"") : "Next hidden. Slow is on.")+'</p>'+controls();
  } else if (view==="content") {
    const next = HITS[index+1];
    body = head(hit)+hands(hit)+'<div class="hands" style="display:block;margin-top:8px"><table>'
      +[["Strike", hit.n+" of 98"],["Place", place(index)],["Wait", hit.wait?"yes":"no"],["Pulse", hit.ms+" ms"],["Right new", spell(fresh(hit.r))],["Right held", spell(held(hit.r))],["Left new", spell(fresh(hit.l))],["Left held", spell(held(hit.l))]]
      .map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join("")+'</table></div><p class="tiny">'+(showNext&&next?"Next is strike "+next.n+", "+place(index+1)+". Letters stay hidden.":"Next hidden. Slow is on.")+'</p>'+controls()+'<div class="three"><button type="button" data-act="say">Say new</button></div>';
  } else {
    const theme = view==="play" ? "dark" : "";
    body = head(hit)+hands(hit, theme)+controls()+(view==="voice"?'<div class="three"><button type="button" data-act="say">Say new</button></div>':"");
  }
  app.innerHTML = body;
  location.hash = view;
}
document.body.addEventListener("click", (event) => {
  const t = event.target.closest("button");
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; render(); return; }
  if (t.dataset.go != null) { index = Number(t.dataset.go); view = "step"; render(); return; }
  const hit = HITS[index];
  if (t.dataset.act==="back") index = Math.max(0, index-1);
  if (t.dataset.act==="next") index = Math.min(HITS.length-1, index+1);
  if (t.dataset.act==="slow") showNext = !showNext;
  if (t.dataset.act==="stop") index = 7;
  if (t.dataset.act==="mark") index = 52;
  if (t.dataset.act==="say") say(hit);
  render();
});
render();
</script>
