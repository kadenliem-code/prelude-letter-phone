<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>After the cascade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Outfit:wght@600;700&display=swap">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #14110e; color: #f4efe6; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
  body { min-height: 100dvh; padding: calc(8px + env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom)); }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 1.65rem; line-height: 1; margin: 4px 0; }
  .meta { margin: 0 0 8px; color: #c4b8a8; font-size: .9rem; }
  .modes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .modes button, .bar button { border: 0; border-radius: 999px; min-height: 44px; font: 700 .95rem Outfit, sans-serif; }
  .modes button { background: #241c16; color: #f4efe6; padding: 0 14px; flex: 0 0 auto; }
  .modes button.on { background: #f4efe6; color: #1c1408; }
  .card { background: #f4efe6; color: #1c1408; border-radius: 18px; border: 3px solid #c4a15a; overflow: hidden; }
  .nowbar { background: #c4a15a; color: #1c1404; text-align: center; font-weight: 800; padding: 4px 8px; }
  .hands { display: grid; grid-template-columns: 1fr 1fr; }
  .hands > div + div { border-left: 1px solid #d9d0c2; }
  .lab { text-align: center; font-size: 11px; letter-spacing: .12em; color: #6d645c; margin: 6px 0 2px; }
  .at { margin: 0; text-align: center; font-family: Fraunces, Georgia, serif; font-weight: 680; line-height: .92; }
  .hold { margin: 0; text-align: center; color: #6a625a; font-weight: 700; }
  .hold span { display: block; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; }
  .big .at { font-size: clamp(1.7rem, 6.2dvh, 3.4rem); }
  .big .hold { font-size: clamp(.8rem, 2.2dvh, 1.1rem); }
  .mid .at { font-size: clamp(1.15rem, 3.4dvh, 1.8rem); }
  .mid .hold { font-size: .8rem; }
  .small .at { font-size: 1.15rem; }
  .small .hold { font-size: .72rem; }
  .nexts { margin-top: 8px; display: grid; gap: 8px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .strip .card { min-width: 168px; }
  .book { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stand { display: grid; gap: 8px; }
  .here { outline: 3px solid #c4a15a; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: #14110e; }
  .bar button { background: #241c16; color: #f4efe6; }
  .bar .play { background: #c4a15a; color: #1c1404; }
</style>
<h1 id="title">After the cascade</h1>
<p class="meta" id="meta"></p>
<div class="modes" id="modes"></div>
<div id="stage"></div>
<div class="bar">
  <button type="button" id="back">Back</button>
  <button type="button" class="play" id="play">Play</button>
  <button type="button" id="next">Next</button>
</div>

    const next = d > 0 ? Math.min(H.length-1, start+8) : Math.max(0, start-8);
    i = next;
  } else {
    i = Math.max(0, Math.min(H.length-1, i+d));
  }
  draw();
}
function play() {
  if (timer) return stop();
  document.getElementById("play").textContent = "Stop";
  timer = setInterval(() => { if (i >= H.length-1) return stop(); i++; draw(); }, 650);
}
MODES.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label; b.dataset.mode = id;
  b.onclick = () => { stop(); mode = id; if (id !== "strike" && i < 7) i = 7; draw(); };
  modes.appendChild(b);
});
document.getElementById("back").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("play").onclick = play;
const hash = location.hash.replace("#","");
if (MODES.some(m => m[0] === hash)) mode = hash;
draw();
</script>
