<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>After the cascade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Outfit:wght@600;700&display=swap">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110e; color: #f4efe6; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
  body { height: 100dvh; max-height: 100dvh; overflow: hidden; display: flex; flex-direction: column; padding: calc(6px + env(safe-area-inset-top)) 10px 0; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 1.45rem; line-height: 1; margin: 2px 0; }
  .meta, .note { margin: 2px 0 6px; color: #c4b8a8; font-size: .82rem; }
  .modes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  button { border: 0; border-radius: 999px; min-height: 44px; font: 700 .92rem Outfit, sans-serif; }
  .modes button { background: #241c16; color: #f4efe6; padding: 0 12px; }
  .modes button.on { background: #f4efe6; color: #1c1408; }
  #stage { flex: 1; min-height: 0; overflow: auto; padding-bottom: 8px; }
  .card { background: #f4efe6; color: #1c1408; border-radius: 16px; overflow: hidden; }
  .word { margin: 0; text-align: center; font-weight: 800; }
  .gold { outline: 3px solid #c4a15a; animation: tap .4s ease; }
  @keyframes tap { from { outline-color: #fff8e8; } to { outline-color: #c4a15a; } }
  .nowbar, .mark { background: #c4a15a; color: #1c1404; text-align: center; font-weight: 800; padding: 3px 8px; }
  .hands { display: grid; grid-template-columns: 1fr 1fr; }
  .hands > div + div { border-left: 1px solid #d9d0c2; }
  .lab { text-align: center; letter-spacing: .14em; color: #6d645c; font-size: 11px; margin: 4px 0 0; }
  .at { margin: 0; text-align: center; font-family: Fraunces, Georgia, serif; font-weight: 680; line-height: .9; }
  .hold { margin: 1px auto; text-align: center; color: #6a625a; font-weight: 700; border: 1px dotted #8a8178; border-radius: 8px; width: fit-content; padding: 0 6px; }
  .fill .at { font-size: clamp(2rem, 7.2dvh, 4.2rem); }
  .card.gold .fill .at, .card.gold .fill .hold { font-size: var(--fit); }
  .card.gold .fill .lab, .card.gold .fill .cue, .card.gold .word { font-size: calc(var(--fit) * .42); }
  .phrase .at { font-size: 1.35rem; }
  .phrase .hold { font-size: .85rem; }
  .page .at { font-size: 1.05rem; }
  .page .hold { font-size: .75rem; }
  .line { height: 4px; border-radius: 99px; background: #c4a15a; margin: 8px 0; }
  .peek { display: flex; gap: 6px; }
  .fit { height: 100%; min-height: 0; display: flex; flex-direction: column; }
  .fit > .card.gold { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .fit > .line { flex: 0 0 auto; }
  .fit > .peek, .peek { flex: 0 0 118px; height: 118px; }
  .peek .at, .peek .hold, .peek .word { font-size: .58rem; line-height: .8; margin: 0; }
  .peek .card { height: 118px; max-height: 118px; overflow: hidden; flex: 1; min-width: 0; }
  .bookpage { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  .bookpage .row { flex: 1 1 0; min-height: 0; margin: 0; overflow: hidden; }
  .strip { height: 100%; align-items: stretch; }
  .strip .card { min-height: 100%; }
  .block { border-left: 3px solid #c4a15a; margin: 0 0 14px; padding-left: 6px; }
  .peek .card { flex: 1; min-width: 0; }
  .row { display: grid; grid-template-columns: 2rem 1fr; gap: 4px; width: 100%; text-align: left; background: #f4efe6; color: #1c1408; border-radius: 12px; padding: 4px; margin: 0 0 6px; min-height: 44px; scroll-margin: 2.6rem; }
  .row.here { outline: 3px solid #c4a15a; }
  .num { font-weight: 800; color: #6d645c; padding-top: 8px; text-align: center; }
  .land { display: block; text-align: left; font-size: .72rem; font-weight: 800; color: #6d645c; padding: 2px 6px 4px; }
  .sec { margin: 10px 0 4px; font-weight: 800; color: #c4a15a; position: sticky; top: 0; background: #14110e; z-index: 2; }
  .strip { display: flex; gap: 8px; overflow-x: auto; }
  .strip .card { min-width: 78%; }
  .bar { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 8px; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); background: #14110e; position: sticky; bottom: 0; }
  .bar button { background: #241c16; color: #f4efe6; }
  .bar .play { background: #c4a15a; color: #1c1404; }
</style>
<h1 id="title">After the cascade</h1>
<p class="meta" id="meta"></p>
<div class="modes" id="songs"></div>
<div class="modes" id="modes"></div>
<div class="modes" id="jumps"></div>
<div id="stage"></div>
<p class="note" id="note"></p>
<div class="bar">
  <button type="button" id="back">Back</button>
  <button type="button" class="play" id="play">Play</button>
  <button type="button" id="next">Next</button>
</div>

const S = [{"n": 1, "w": "I", "m": "Bar 1. Gm.", "r": [{"t": "C3", "h": false}], "l": [{"t": "G2", "h": false}]}, {"n": 2, "w": "try", "r": [{"t": "D3", "h": false}], "l": [{"t": "G2", "h": false}]}, {"n": 3, "w": "my", "r": [{"t": "E3", "h": false}], "l": [{"t": "G2", "h": false}]}, {"n": 4, "w": "best", "r": [{"t": "G3", "h": false}], "l": [{"t": "G2", "h": false}]}, {"n": 5, "w": "to", "m": "Bar 2. F.", "r": [{"t": "F3", "h": false}], "l": [{"t": "F2", "h": false}]}, {"n": 6, "w": "pre-", "r": [{"t": "E3", "h": false}], "l": [{"t": "F2", "h": false}]}, {"n": 7, "w": "tend", "r": [{"t": "D3", "h": false}], "l": [{"t": "F2", "h": false}]}, {"n": 8, "w": "that", "r": [{"t": "C3", "h": false}], "l": [{"t": "F2", "h": false}]}, {"n": 9, "w": "I'm", "m": "Bar 3. C.", "r": [{"t": "C3", "h": false}], "l": [{"t": "C2", "h": false}]}, {"n": 10, "w": "not", "r": [{"t": "D3", "h": false}], "l": [{"t": "C2", "h": false}]}, {"n": 11, "w": "home", "r": [{"t": "E3", "h": false}], "l": [{"t": "C2", "h": false}]}, {"n": 12, "w": "hold", "m": "Bar 4. C holds. Written piano staves were not copied.", "r": [{"t": "C3", "h": false}], "l": [{"t": "C2", "h": false}]}];
let song = "prelude";
let i = 7, mode = "synthesia", timer = 0;
function list(){ return song==="romeo" ? R : song==="score" ? S : song==="sand" ? Q : H; }
function cueWord(){ return song==="prelude" ? "low ↑" : "high ↑"; }
function place(n){ if(song!=="prelude") return "Verse"; if(n<=20) return "Opening"; if(n<=52) return "Fast middle"; if(n<85) return "After the middle"; return "Ending"; }
function land(ev){
  if(ev.m) return ev.m;
  const n = ev.n;
  if(song!=="prelude") return "";
  if(n===8) return "A-sharp stop. Next strikes are still the opening.";
  if(n===9) return "Check. Right hand A then A. Left hand A then A.";
  if(n===53) return "Practice jump after the fast middle. Not measure 53.";
  if(n===98) return "Final chord. Struck here, then held.";
  if(n===1) return "Opening.";
  if(n===85) return "Ending.";
  return "";
}
function col(name, notes, size){
  const body = notes.length ? notes.map(n => n.h ? '<p class="hold">'+n.t+'</p>' : '<p class="at">'+n.t+'</p>').join("") : '<p class="at">—</p>';
  return '<div class="'+size+'"><p class="lab">'+name+'</p><p class="cue">'+cueWord()+'</p>'+body+'</div>';
}
function hands(h, size){ return '<div class="hands">'+col("RIGHT", h.r, size)+col("LEFT", h.l, size)+'</div>'+(h.w?'<p class="word">'+h.w+'</p>':''); }
function pageStart(idx){
  if(song==="prelude") return idx<7 ? 0 : 7+Math.floor((idx-7)/8)*8;
  return Math.floor(idx/8)*8;
}
function draw(hear){
  const evs = list();
  const h = evs[i];
  const modeName = MODES.find(m=>m[0]===mode)[1];
  document.getElementById("title").textContent = song==="romeo" ? "Romeo and Juliet" : song==="score" ? "Keeping Score" : song==="sand" ? "Quicksand" : mode==="book" ? "After the A♯" : mode==="stand" ? "Prelude in C-sharp minor" : "After the cascade";
  document.getElementById("meta").textContent = "Strike "+h.n+" of "+evs.length+" · "+place(h.n)+" · "+modeName;
  const L = land(h);
  const singer = song!=="prelude";
  let html = "", note = !singer ? "Low key on top. Left stack is your right hand. Gray, dotted, is still holding. It is not a new strike." : song==="romeo" ? "High note on top. Right hand is the pitch you sing. Piano rows were blank, so the left hand is a dash." : "High note on top. Right hand is the pitch you sing. Left hand is only the chord root. The printed piano is not copied.";
  if(mode==="synthesia"){
    html = '<div class="fit"><div class="card gold"><p class="nowbar" id="pulse">Now'+(h.w?" · "+h.w:"")+(L?" · "+L:"")+'</p>'+hands(h,"fill")+'</div><div class="line"></div><div class="peek">';
    for(let k=1;k<=3;k++){
      if(evs[i+k]) html += '<div class="card"><p class="nowbar">Next '+evs[i+k].n+(evs[i+k].w?" · "+evs[i+k].w:"")+'</p>'+hands(evs[i+k],"page")+'</div>';
      else html += '<div class="card"><p class="nowbar">End</p><div class="hands page"><div><p class="lab">RIGHT</p><p class="cue">'+cueWord()+'</p><p class="at">—</p></div><div><p class="lab">LEFT</p><p class="cue">'+cueWord()+'</p><p class="at">—</p></div></div></div>';
    }
    html += '</div></div>';
    note = "Synthesia. This strike fills the screen. The next three peek under the gold line.";
  } else if(mode==="strike"){
    html = '<div class="fit"><div class="card gold"><p class="nowbar">Strike '+h.n+(h.w?" · "+h.w:"")+(L?" · "+L:"")+'</p>'+hands(h,"fill")+'</div></div>';
    const nxt = evs[i+1];
    note = nxt ? "Next "+nxt.n+(nxt.w?" · "+nxt.w:"")+". Still down stays small. The letters here are the new strike." : "End. The last chord holds. It does not strike again.";
  } else if(mode==="book"){
    const start = pageStart(i);
    const take = (song==="prelude" && start===0) ? 7 : 8;
    const slice = evs.slice(start, start+take);
    html = '<div class="bookpage"><p class="note">'+(singer?"High note on top. Right hand sings. ":"Low key on top. Left stack is the right hand. ")+slice[0].n+"–"+slice[slice.length-1].n+" of "+evs.length+".</p>";
    slice.forEach(ev => {
      const lm = land(ev);
      html += '<button type="button" class="row'+(ev.n===h.n?" here":"")+'" data-go="'+(ev.n-1)+'"><span class="num">'+ev.n+'</span><span>'+hands(ev,"phrase")+(lm?'<span class="land">'+lm+'</span>':"")+'</span></button>';
    });
    for (let pad = slice.length; pad < 8; pad++) html += '<div class="row"><span class="num">·</span><span class="land">Blank. This page keeps eight places.</span></div>';
    html += '</div>';
    note = "Book. Eight strikes. Next turns the page.";
  } else if(mode==="strip"){
    html = '<div class="strip">';
    for(let k=i;k<Math.min(evs.length,i+4);k++) html += '<button type="button" class="card'+(k===i?" gold":"")+'" data-go="'+k+'"><p class="nowbar">'+(k===i?"Now":"+"+(k-i))+" "+evs[k].n+(evs[k].w?" · "+evs[k].w:"")+'</p>'+hands(evs[k],"phrase")+'</button>';
    html += '<div style="min-width:80%"></div></div>';
    note = "Steady strip. Your place stays on the left. Look right for the next changes.";
  } else {
    let prev = "";
    html = '<div class="stand">';
    evs.forEach((ev, idx) => {
      const sec = place(ev.n);
      if(sec!==prev){ if(prev) html += '</div>'; html += '<div class="block"><p class="sec">'+sec+'</p>'; prev = sec; }
      const lm = land(ev);
      html += '<button type="button" class="row'+(idx===i?" here":"")+'" data-go="'+idx+'" id="s'+ev.n+'"><span class="num">'+ev.n+'</span><span>'+hands(ev,"page")+(lm?'<span class="land">'+lm+'</span>':"")+'</span></button>';
    });
    html += '</div></div>';
    note = song==="romeo" ? "Stand. Every sung pitch that was printed. Piano staves stay empty." : song==="score" ? "Stand. Bars 1 to 4 only. The rest of Keeping Score is not engraved." : song==="sand" ? "Stand. Bars 5 to 8 only." : "Stand. The whole prelude. Tap a strike. Sections are marked.";
  }
  const stage = document.getElementById("stage");
  stage.innerHTML = html;
  document.getElementById("note").textContent = note;
  document.getElementById("jumps").style.display = song==="prelude" ? "" : "none";
  stage.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { stop(); i = Number(el.dataset.go); draw(true); });
  [...document.getElementById("modes").children].forEach(b => b.classList.toggle("on", b.dataset.mode===mode));
  [...document.getElementById("songs").children].forEach(b => b.classList.toggle("on", b.dataset.song===song));
  if(mode==="stand"){
    const here = document.getElementById("s"+h.n);
    if(here){
      const y = here.getBoundingClientRect().top - stage.getBoundingClientRect().top + stage.scrollTop - stage.clientHeight/2 + here.clientHeight/2;
      stage.scrollTop = Math.max(0, y);
    }
  }
  fitCard();
  if(hear) sound(h);
  history.replaceState(null,"","#"+mode);
}
function fitCard(){
  document.querySelectorAll("#stage .card.gold").forEach(card => {
    const notes = card.querySelectorAll(".at, .hold");
    if(!notes.length) return;
    let px = 28;
    const apply = () => {
      notes.forEach(el => { el.style.fontSize = px+"px"; el.style.lineHeight = ".9"; el.style.margin = "0"; });
      card.querySelectorAll(".cue, .lab, .word").forEach(el => { el.style.fontSize = Math.max(8, px*0.38)+"px"; el.style.margin = "0"; });
    };
    apply();
    for(let n=0; n<20 && card.scrollHeight > card.clientHeight+1; n++){
      px = Math.max(8, px*0.86);
      apply();
    }
  });
}
let ac;
function freq(name){
  const m = /^([A-G])([♯b♭]?)(\d)$/.exec(name);
  if(!m) return 0;
  const pc = {C:0,"D":2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]==="♯"?1:(m[2]==="b"||m[2]==="♭")?-1:0);
  const midi = (Number(m[3])+1)*12 + pc;
  return 440 * Math.pow(2, (midi-69)/12);
}
function sound(h){
  const attacks = [...h.r, ...h.l].filter(n => !n.h);
  if(!attacks.length) return;
  if(!ac) ac = new AudioContext();
  if(ac.state==="suspended") ac.resume();
  const t0 = ac.currentTime;
  attacks.forEach(note => {
    const f = freq(note.t);
    if(!f) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.07, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.42);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+0.46);
  });
}
function stop(){ clearInterval(timer); timer=0; document.getElementById("play").textContent="Play"; }
function step(d){
  stop();
  const last = list().length-1;
  if(mode==="book"){
    const start = pageStart(i);
    if(d>0){
      let next = (song==="prelude" && start===0) ? 7 : start+8;
      i = next>last ? start : next;
    } else if(song==="prelude") {
      i = start<=7 ? 0 : start-8;
    } else i = Math.max(0, start-8);
  } else i = Math.max(0, Math.min(last, i+d));
  draw(true);
}
function play(){
  if(timer) return stop();
  document.getElementById("play").textContent="Stop";
  sound(list()[i]);
  timer = setInterval(()=>{ if(i>=list().length-1) return stop(); i++; draw(true); }, 650);
}
const modes = document.getElementById("modes");
MODES.forEach(([id,label])=>{
  const b=document.createElement("button");
  b.type="button"; b.textContent=label; b.dataset.mode=id;
  b.onclick=()=>{ stop(); mode=id; if(song==="prelude" && i<7 && id!=="stand" && id!=="book") i=7; draw(); };
  modes.appendChild(b);
});
[["prelude","Prelude"],["sand","Quicksand"],["romeo","Romeo"],["score","Keeping Score"]].forEach(([id,label])=>{
  const b=document.createElement("button");
  b.type="button"; b.textContent=label; b.dataset.song=id;
  b.onclick=()=>{ stop(); song=id; i = id==="prelude" ? 7 : 0; mode="synthesia"; draw(); };
  document.getElementById("songs").appendChild(b);
});
document.getElementById("back").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.getElementById("play").onclick=play;
[8,9,53,98].forEach(n=>{
  const b=document.createElement("button");
  b.type="button";
  b.textContent = n===8 ? "A♯ 8" : n===9 ? "9 check" : n===53 ? "53 jump" : "98 end";
  b.onclick=()=>{ if(song!=="prelude") return; stop(); i=n-1; draw(true); };
  document.getElementById("jumps").appendChild(b);
});
const hash=location.hash.replace("#","");
if(MODES.some(m=>m[0]===hash)) mode=hash;
draw();
